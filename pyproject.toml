[project]
name = "test-gonfleur"
version = "0.1.0"
description = "Pressure controller desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt5==5.15.11",
    # Pinned: newer pyqt5-qt5 releases (e.g. 5.15.19) stopped shipping Windows
    # wheels, which breaks `uv sync` on Windows with "no matching distribution".
    "pyqt5-qt5==5.15.2",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
]

[project.scripts]
SqueezeCtrl = "main:main"

[dependency-groups]
dev = ["jupyter>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["main.py"]
